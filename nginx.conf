# =============================================================================
# Orion School Management System - Production Nginx Reverse Proxy Configuration
# Hostinger VPS / Ubuntu / Debian
# Location on server: /etc/nginx/sites-available/orion
# =============================================================================

upstream orion_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- Redirect HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name orionbasicskool.com www.orionbasicskool.com;

    # Let's Encrypt Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Main Server Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orionbasicskool.com www.orionbasicskool.com;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/orionbasicskool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionbasicskool.com/privkey.pem;

    # SSL Parameters & Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Maximum upload size for student photos & bulk CSV/PDF files
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/manifest+json
        image/svg+xml;

    # Web root directory for static assets
    root /var/www/orion/web;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PWA Service Worker (disable browser cache for sw.js)
    location /sw.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /sw.js =404;
    }

    # PWA Manifest
    location /manifest.json {
        add_header Content-Type "application/manifest+json";
        try_files /manifest.json =404;
    }

    # Static CSS, JS, Assets & Icons Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend;
    }

    # Uploads Storage
    location /uploads/ {
        alias /var/www/orion/web/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @backend;
    }

    # API and Dynamic Application Proxy
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://orion_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for heavy PDF/report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
